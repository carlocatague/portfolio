<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    ╔══════════════════════════════════════════════════════╗
    ║  JC FAVICON — edit freely in GitHub                 ║
    ║                                                      ║
    ║  BG_COLOR      → fill on the <rect> (line below)    ║
    ║  ACCENT_COLOR  → fill="#c9a96e" on brackets/slash   ║
    ║  TEXT_COLOR    → fill="#f0ece4" on the initials     ║
    ║  INITIALS      → change "JC" text to anything       ║
    ║  FONT SIZE     → font-size on each <text> element   ║
    ╚══════════════════════════════════════════════════════╝
  -->

  <!-- Background — change fill to update bg color -->
  <rect width="64" height="64" rx="14" fill="#0e0e12"/>

  <!-- Border ring — change stroke to update border color -->
  <rect width="64" height="64" rx="14" fill="none" stroke="#c9a96e" stroke-width="1.5" opacity="0.4"/>

  <!-- Left bracket < -->
  <!-- <text x="4" y="44" font-family="Courier New, monospace" font-size="22" font-weight="400" fill="#c9a96e">&lt;</text> -->

  <!-- Initials — CHANGE "JC" HERE -->
  <text x="32" y="43" font-family="Outfit, Arial, sans-serif" font-size="30" font-weight="1000" fill="#f0ece4" text-anchor="middle">JC</text>

  <!-- Slash / -->
  <!-- <text x="50" y="44" font-family="Courier New, monospace" font-size="13" font-weight="400" fill="#c9a96e" opacity="0.7">/</text> -->

  <!-- Right bracket > -->
  <!-- <text x="55" y="44" font-family="Courier New, monospace" font-size="22" font-weight="400" fill="#c9a96e">&gt;</text> -->
</svg>
